<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f4">
  <title>Little List — To-do</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f7f4;
      --surface: #ffffff;
      --text: #242622;
      --muted: #85877f;
      --line: #e9eae5;
      --accent: #65795c;
      --accent-hover: #52664a;
      --accent-soft: #edf1e9;
      --danger: #b45e55;
      --shadow: 0 18px 55px rgb(35 39 31 / 7%), 0 2px 8px rgb(35 39 31 / 3%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #171916;
        --surface: #222520;
        --text: #eceee8;
        --muted: #999d93;
        --line: #353a32;
        --accent: #a2b694;
        --accent-hover: #b5c8a7;
        --accent-soft: #30382c;
        --danger: #e08b80;
        --shadow: 0 18px 55px rgb(0 0 0 / 20%), 0 2px 8px rgb(0 0 0 / 10%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 80px 20px 48px;
      background:
        radial-gradient(ellipse at 82% 13%, rgb(255 196 211 / 58%), transparent 32%),
        radial-gradient(ellipse at 14% 38%, rgb(202 198 255 / 48%), transparent 37%),
        radial-gradient(ellipse at 74% 88%, rgb(255 222 182 / 52%), transparent 38%),
        linear-gradient(145deg, #fff7f2 0%, #f4f1ff 48%, #eef8ff 100%);
      background-attachment: fixed;
      color: var(--text);
      font-size: 15px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background:
          radial-gradient(ellipse at 82% 13%, rgb(135 69 105 / 30%), transparent 32%),
          radial-gradient(ellipse at 14% 38%, rgb(74 68 135 / 32%), transparent 37%),
          radial-gradient(ellipse at 74% 88%, rgb(145 101 65 / 22%), transparent 38%),
          linear-gradient(145deg, #211c29 0%, #1b1c2c 48%, #17232b 100%);
        background-attachment: fixed;
      }
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(100%, 540px);
      margin: 0 auto;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 42px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .brand-mark svg { width: 17px; height: 17px; }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 13px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .eyebrow-mark {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 8vw, 40px);
      font-weight: 650;
      letter-spacing: -.055em;
      line-height: 1.1;
    }

    .subtitle {
      margin: 10px 0 31px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .progress-card {
      margin-bottom: 16px;
      padding: 17px 19px 16px;
      border: 1px solid rgb(120 128 108 / 9%);
      border-radius: 15px;
      background: color-mix(in srgb, var(--surface) 84%, transparent);
      box-shadow: 0 8px 24px rgb(35 39 31 / 4%);
    }

    .progress-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 11px;
    }

    .progress-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .progress-count {
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      height: 6px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--accent-soft);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 240ms ease;
    }

    .list-card {
      overflow: hidden;
      border: 1px solid rgb(120 128 108 / 9%);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .add-form {
      display: flex;
      gap: 10px;
      padding: 19px;
      border-bottom: 1px solid var(--line);
    }

    .add-input {
      min-width: 0;
      flex: 1;
      padding: 0 3px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 15px;
    }

    .add-input::placeholder { color: #a5a79f; }
    @media (prefers-color-scheme: dark) {
      .add-input::placeholder { color: #777c72; }
    }

    .add-button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 40px;
      padding: 0 14px;
      border: 0;
      border-radius: 11px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: background 160ms ease, transform 160ms ease;
    }

    .add-button:hover { background: var(--accent-hover); }
    .add-button:active { transform: scale(.97); }
    .add-button svg { width: 15px; height: 15px; }

    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 21px 22px 11px;
    }

    .list-heading h2 {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .count {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .task-list {
      margin: 0;
      padding: 0 12px;
      list-style: none;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 66px;
      padding: 10px 10px;
      border-bottom: 1px solid var(--line);
      animation: arrive 240ms cubic-bezier(.2, .7, .2, 1) both;
    }

    .task:last-child { border-bottom: 0; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .check {
      position: relative;
      display: grid;
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      place-items: center;
      padding: 0;
      border: 1.5px solid #c9ccc3;
      border-radius: 50%;
      background: transparent;
      color: white;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .check:hover { border-color: var(--accent); transform: scale(1.08); }
    .check svg { width: 13px; height: 13px; opacity: 0; transform: scale(.45); transition: opacity 160ms ease, transform 200ms cubic-bezier(.2, .8, .2, 1.4); }
    .task.is-done .check { border-color: var(--accent); background: var(--accent); }
    .task.is-done .check svg { opacity: 1; transform: scale(1); }

    .task-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      line-height: 1.45;
      transition: color 180ms ease;
    }

    .task.is-done .task-text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }

    .delete-button {
      display: grid;
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      place-items: center;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      opacity: 0;
      transition: opacity 150ms ease, background 150ms ease, color 150ms ease;
    }

    .task:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
    .delete-button:hover { background: rgb(180 94 85 / 10%); color: var(--danger); }
    .delete-button svg { width: 16px; height: 16px; }

    .list-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 64px;
      padding: 12px 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .filters { display: flex; gap: 3px; }

    .footer-clock {
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .filter-button, .clear-button {
      padding: 7px 9px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      transition: color 150ms ease, background 150ms ease;
    }

    .filter-button:hover, .clear-button:hover { color: var(--text); }
    .filter-button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
    .clear-button { padding-right: 0; }
    .clear-button:disabled { cursor: default; opacity: .45; }

    .empty-state {
      padding: 32px 16px 36px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .empty-icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      margin: 0 auto 12px;
      border-radius: 14px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .empty-icon svg { width: 20px; height: 20px; }
    .empty-state p { margin: 0; }

    .hint {
      margin: 17px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    button:focus-visible, input:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      outline-offset: 3px;
    }

    @media (hover: none) {
      .delete-button { opacity: .65; }
    }

    @media (max-width: 420px) {
      body { padding: 48px 16px 32px; }
      .brand { margin-bottom: 34px; }
      .list-footer { flex-wrap: wrap; padding-inline: 14px; }
      .footer-clock { order: 3; flex-basis: 100%; text-align: center; }
      .filter-button { padding-inline: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none"><path d="M15.7 4.3c-5.8.2-9.5 2.2-9.5 6.1 0 2.1 1.4 3.4 3.3 3.4 3.9 0 5.9-3.7 6.2-9.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M4.3 15.7c2.1-3.8 4.6-5.9 8.1-7.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </span>
      Little List
    </div>
    <p class="eyebrow"><span class="eyebrow-mark" aria-hidden="true"></span> A little space to focus</p>
    <h1>Make today count.</h1>
    <p class="subtitle">A little progress is still progress. What matters to you today?</p>

    <section class="progress-card" aria-label="Today's progress">
      <div class="progress-topline">
        <span class="progress-label">Daily progress</span>
        <span class="progress-count" id="progress-count">0 of 0 complete</span>
      </div>
      <div
        class="progress-track"
        id="progress-track"
        role="progressbar"
        aria-label="Tasks completed"
        aria-valuemin="0"
        aria-valuemax="1"
        aria-valuenow="0"
      >
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </section>

    <section class="list-card" aria-label="To-do list">
      <form class="add-form" id="add-form">
        <input class="add-input" id="task-input" type="text" maxlength="200" placeholder="Add a task..." aria-label="New task" autocomplete="off" required>
        <button class="add-button" type="submit">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Add task
        </button>
      </form>

      <div class="list-heading">
        <h2>Your tasks</h2>
        <span class="count" id="task-count" aria-live="polite"></span>
      </div>

      <ul class="task-list" id="task-list" aria-label="Tasks"></ul>

      <div class="list-footer">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Done</button>
        </div>
        <time class="footer-clock" id="footer-clock" aria-label="Current local time and date"></time>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </div>
    </section>
    <p class="hint">Your list is saved automatically on this device.</p>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "little-list.tasks.v1";
      const examples = [
        { id: "example-1", text: "Plan the week ahead", completed: false },
        { id: "example-2", text: "Take a proper lunch break", completed: false },
        { id: "example-3", text: "Pick up something fresh for dinner", completed: false }
      ];

      const form = document.querySelector("#add-form");
      const input = document.querySelector("#task-input");
      const list = document.querySelector("#task-list");
      const count = document.querySelector("#task-count");
      const progressCount = document.querySelector("#progress-count");
      const progressTrack = document.querySelector("#progress-track");
      const progressFill = document.querySelector("#progress-fill");
      const clock = document.querySelector("#footer-clock");
      const clearButton = document.querySelector("#clear-completed");
      const filterButtons = [...document.querySelectorAll(".filter-button")];
      let filter = "all";
      let tasks = loadTasks();

      function updateClock() {
        const now = new Date();
        const pad = value => String(value).padStart(2, "0");
        clock.dateTime = now.toISOString();
        clock.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())} · ${pad(now.getMonth() + 1)}/${pad(now.getDate())}/${now.getFullYear()}`;
      }

      function loadTasks() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved === null) return examples;
          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed)) throw new Error("Saved task list is not an array.");
          return parsed.filter(task =>
            task && typeof task.id === "string" &&
            typeof task.text === "string" && typeof task.completed === "boolean"
          );
        } catch (error) {
          console.error("Could not load the saved task list.", error);
          return examples;
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (error) {
          console.error("Could not save the task list.", error);
        }
      }

      function makeIcon(markup) {
        const wrapper = document.createElement("span");
        wrapper.innerHTML = markup;
        return wrapper.firstElementChild;
      }

      function render() {
        list.replaceChildren();
        const visibleTasks = tasks.filter(task =>
          filter === "all" || (filter === "active" && !task.completed) ||
          (filter === "completed" && task.completed)
        );

        if (visibleTasks.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty-state";
          empty.innerHTML = '<div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m7 12 3.2 3.2L17.5 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/></svg></div><p></p>';
          empty.querySelector("p").textContent = filter === "completed"
            ? "No completed tasks yet."
            : filter === "active" ? "You're all caught up." : "Your list is clear. Add a task to get started.";
          list.append(empty);
        } else {
          for (const task of visibleTasks) {
            const item = document.createElement("li");
            item.className = `task${task.completed ? " is-done" : ""}`;

            const check = document.createElement("button");
            check.className = "check";
            check.type = "button";
            check.setAttribute("aria-label", `${task.completed ? "Mark as active" : "Complete"}: ${task.text}`);
            check.setAttribute("aria-pressed", String(task.completed));
            check.append(makeIcon('<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3.5 8.2 2.8 2.7 6.2-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'));
            check.addEventListener("click", () => {
              task.completed = !task.completed;
              saveTasks();
              render();
            });

            const text = document.createElement("span");
            text.className = "task-text";
            text.textContent = task.text;

            const remove = document.createElement("button");
            remove.className = "delete-button";
            remove.type = "button";
            remove.setAttribute("aria-label", `Delete: ${task.text}`);
            remove.append(makeIcon('<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4.5 6h11M8 6V4.5h4V6m2.5 0-.6 9.2H6.1L5.5 6m3 3v3.5m3-3v3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'));
            remove.addEventListener("click", () => {
              tasks = tasks.filter(candidate => candidate.id !== task.id);
              saveTasks();
              render();
            });

            item.append(check, text, remove);
            list.append(item);
          }
        }

        const remaining = tasks.filter(task => !task.completed).length;
        const completed = tasks.length - remaining;
        const progress = tasks.length ? Math.round(completed / tasks.length * 100) : 0;
        count.textContent = `${remaining} ${remaining === 1 ? "task" : "tasks"} left`;
        progressCount.textContent = `${completed} of ${tasks.length} complete`;
        progressTrack.setAttribute("aria-valuemax", String(Math.max(tasks.length, 1)));
        progressTrack.setAttribute("aria-valuenow", String(completed));
        progressFill.style.width = `${progress}%`;
        clearButton.disabled = !tasks.some(task => task.completed);
        filterButtons.forEach(button =>
          button.setAttribute("aria-pressed", String(button.dataset.filter === filter))
        );
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        tasks.push({ id: crypto.randomUUID(), text, completed: false });
        saveTasks();
        filter = "all";
        input.value = "";
        render();
        input.focus();
      });

      filterButtons.forEach(button => {
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          render();
        });
      });

      clearButton.addEventListener("click", () => {
        tasks = tasks.filter(task => !task.completed);
        saveTasks();
        render();
      });

      render();
      updateClock();
      window.setInterval(updateClock, 1000);
    })();
  </script>
</body>
</html>
